<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ריכוז נתונים להצהרת הון</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Assistant:wght@400;600;700&family=Frank+Ruhl+Libre:wght@500;700&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<style>
:root{
  /* דף עבודה של משרד: נייר בהיר, דיו כחול כהה, חותמת כחולה כהדגשה. סרגל תיקים בצד וטופס בצד השני */
  --bg:#eef1f4; --surface:#ffffff; --ink:#15212c; --muted:#5a6876; --line:#d6dde4; --soft:#f5f7f9;
  --accent:#1c5878; --accent-ink:#ffffff; --accent-soft:#e1ecf2;
  --warn:#94540a; --warn-soft:#fbefdc; --ok:#1f6e46; --ok-soft:#e0f1e7; --bad:#a12f2f; --bad-soft:#f8e3e3;
  --display:'Frank Ruhl Libre', 'David', Georgia, serif;
  --body:'Assistant', 'Segoe UI', Arial, sans-serif;
  color-scheme: light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#11171d; --surface:#18212a; --ink:#e4eaf0; --muted:#97a5b2; --line:#2b3843; --soft:#1d2731;
    --accent:#6fb0d2; --accent-ink:#0d1a22; --accent-soft:#1d3442;
    --warn:#e3a957; --warn-soft:#3a2c17; --ok:#6cc596; --ok-soft:#173326; --bad:#ec8a8a; --bad-soft:#3d1f1f;
    color-scheme: dark;
  }
}
:root[data-theme="dark"]{
  --bg:#11171d; --surface:#18212a; --ink:#e4eaf0; --muted:#97a5b2; --line:#2b3843; --soft:#1d2731;
  --accent:#6fb0d2; --accent-ink:#0d1a22; --accent-soft:#1d3442;
  --warn:#e3a957; --warn-soft:#3a2c17; --ok:#6cc596; --ok-soft:#173326; --bad:#ec8a8a; --bad-soft:#3d1f1f;
  color-scheme: dark;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.5}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.app{display:grid;grid-template-columns:270px 1fr;min-height:100%}
aside{background:var(--surface);border-inline-end:1px solid var(--line);padding:18px 14px;display:flex;flex-direction:column;gap:12px}
.brand{font-family:var(--display);font-size:21px;font-weight:700;line-height:1.2;text-wrap:balance}
.brand small{display:block;font-family:var(--body);font-size:13px;font-weight:400;color:var(--muted);margin-top:2px}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:7px;padding:6px 12px;display:inline-flex;align-items:center;gap:6px;white-space:nowrap}
.btn:hover{border-color:var(--accent)}
.btn.pri{background:var(--accent);color:var(--accent-ink);border-color:var(--accent);font-weight:600}
.btn.ghost{border-color:transparent;background:transparent;color:var(--muted)}
.btn.ghost:hover{color:var(--ink);border-color:var(--line)}
.btn.sm{padding:3px 9px;font-size:13px}
.btn.danger{color:var(--bad)}
.btn.danger.armed{background:var(--bad);color:#fff;border-color:var(--bad)}
.btn:disabled{opacity:.5;cursor:default}
.search{width:100%;border:1px solid var(--line);border-radius:7px;padding:6px 10px;background:var(--soft)}
.clist{display:flex;flex-direction:column;gap:4px;overflow:auto;flex:1}
.citem{all:unset;cursor:pointer;display:block;padding:8px 10px;border-radius:7px;border:1px solid transparent}
.citem:hover{background:var(--soft)}
.citem.on{background:var(--accent-soft);border-color:var(--accent)}
.citem b{display:block;font-weight:600}
.citem span{font-size:13px;color:var(--muted);display:flex;gap:8px;flex-wrap:wrap}
.pill{display:inline-flex;align-items:center;gap:4px;border-radius:999px;padding:0 8px;font-size:12px;font-weight:600;line-height:20px;white-space:nowrap}
.pill.warn{background:var(--warn-soft);color:var(--warn)}
.pill.ok{background:var(--ok-soft);color:var(--ok)}
.pill.bad{background:var(--bad-soft);color:var(--bad)}
.pill.info{background:var(--accent-soft);color:var(--accent)}
.syncbox{display:flex;flex-direction:column;gap:4px;border-top:1px solid var(--line);padding-top:10px}
.syncbox .small{color:var(--muted)}
.syncbox .err{color:var(--bad)} .syncbox .okc{color:var(--ok)}
.combo{position:relative;max-width:520px;margin-top:4px}
.dd{position:absolute;top:calc(100% + 4px);inset-inline:0;background:var(--surface);border:1px solid var(--line);border-radius:8px;box-shadow:0 8px 24px rgba(0,0,0,.12);max-height:320px;overflow:auto;z-index:5}
.ddi{display:flex;gap:10px;align-items:baseline;padding:7px 12px;cursor:pointer}
.ddi span{font-size:13px;color:var(--muted);flex:1}
.ddi.hi,.ddi:hover{background:var(--accent-soft)}
.ddnote{padding:8px 12px;font-size:13px;color:var(--muted)}
.card:has(.combo){min-height:380px}
.savestate{font-size:12px;color:var(--muted)}
main{padding:22px 26px 60px;min-width:0;display:flex;flex-direction:column;gap:16px}
.head{display:flex;justify-content:space-between;align-items:flex-end;gap:12px;flex-wrap:wrap}
.head h1{font-family:var(--display);font-size:28px;margin:0;font-weight:700;line-height:1.15;text-wrap:balance}
.namebtn{all:unset;cursor:pointer;border-radius:6px;padding:0 4px;display:inline-flex;align-items:center;gap:8px}
.namebtn:hover{background:var(--accent-soft)}
.namebtn:focus-visible{outline:2px solid var(--accent)}
.namebtn .pen{font-size:16px;color:var(--muted)}
.head .sub{color:var(--muted);font-size:14px;display:flex;gap:12px;flex-wrap:wrap}
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line)}
.tab{all:unset;cursor:pointer;padding:8px 14px;border-bottom:3px solid transparent;color:var(--muted);font-weight:600;display:flex;gap:6px;align-items:center}
.tab.on{color:var(--ink);border-color:var(--accent)}
.tab:focus-visible{outline:2px solid var(--accent)}
.card{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:14px 16px}
.card h2{font-size:17px;margin:0;font-weight:700;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.card h2 .no{font-family:var(--display);color:var(--accent);font-size:19px}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.between{justify-content:space-between}
.muted{color:var(--muted)}
.small{font-size:13px}
.grid-form{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:10px 14px;margin-top:12px}
.fld{display:flex;flex-direction:column;gap:3px}
.fld label{font-size:12.5px;color:var(--muted);font-weight:600}
.in{border:1px solid var(--line);border-radius:6px;padding:5px 8px;background:var(--surface);min-width:0;width:100%}
.in:focus{border-color:var(--accent)}
.in.bad{border-color:var(--bad);background:var(--bad-soft)}
.in.num{direction:ltr;text-align:right;font-variant-numeric:tabular-nums}
.in.cur{direction:ltr;text-align:right;text-transform:uppercase}
.drop{border:2px dashed var(--line);border-radius:12px;padding:26px;text-align:center;background:var(--soft);display:flex;flex-direction:column;gap:8px;align-items:center}
.drop.over{border-color:var(--accent);background:var(--accent-soft)}
.drop strong{font-size:17px}
.jobs{display:flex;flex-direction:column;gap:6px;margin-top:10px}
.job{display:flex;gap:10px;align-items:center;font-size:14px;padding:6px 10px;border-radius:7px;background:var(--soft)}
.spin{width:14px;height:14px;border:2px solid var(--line);border-top-color:var(--accent);border-radius:50%;animation:sp 0.8s linear infinite;flex:none}
@keyframes sp{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion: reduce){.spin{animation:none;border-top-color:var(--accent)}}
.pcard{border:1px solid var(--line);border-inline-start:4px solid var(--warn);border-radius:9px;padding:12px 14px;background:var(--surface)}
.pcard .grid-form{grid-template-columns:repeat(auto-fill,minmax(150px,1fr))}
.note{font-size:13.5px;color:var(--muted);margin-top:6px}
.tablewrap{overflow-x:auto;margin-top:10px}
table{border-collapse:collapse;width:100%;font-size:14px}
th{font-size:12.5px;color:var(--muted);font-weight:600;text-align:right;padding:6px 6px;border-bottom:1px solid var(--line);white-space:nowrap}
td{padding:4px 6px;border-bottom:1px solid var(--line);vertical-align:middle}
td .in{min-width:90px}
td .in.wide{min-width:180px}
td.v, th.v{text-align:left;direction:ltr;font-variant-numeric:tabular-nums;white-space:nowrap;font-weight:600}
tfoot td{font-weight:700;border-bottom:none;padding-top:8px}
.secempty{display:flex;flex-wrap:wrap;gap:6px}
.copy{cursor:pointer;border-radius:4px;padding:2px 4px}
.copy:hover{background:var(--accent-soft)}
.sumtbl td{padding:6px 6px}
.totals{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px}
.tot{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:12px 14px;display:flex;flex-direction:column;gap:2px}
.tot .lbl{font-size:13px;color:var(--muted)}
.tot .val{font-size:24px;font-weight:700;font-variant-numeric:tabular-nums;direction:ltr;text-align:right}
.tot .code{font-size:12px;color:var(--muted)}
.tot.net{border-color:var(--accent);background:var(--accent-soft)}
.alerts{display:flex;flex-direction:column;gap:6px}
.alert{border-radius:8px;padding:8px 12px;font-size:14px;background:var(--warn-soft);color:var(--warn)}
.alert.info{background:var(--accent-soft);color:var(--accent)}
.empty{max-width:640px;margin:40px auto;text-align:center;display:flex;flex-direction:column;gap:14px;align-items:center}
.empty h1{font-family:var(--display);font-size:30px;margin:0;text-wrap:balance}
.steps{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:10px;text-align:right;width:100%}
.steps div{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:12px}
.steps b{font-family:var(--display);color:var(--accent);font-size:20px;display:block}
.toast{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:8px 16px;border-radius:8px;font-size:14px;display:none;gap:10px;align-items:center;z-index:9;max-width:90vw}
.toast.on{display:flex}
.toast button{all:unset;cursor:pointer;text-decoration:underline;font-weight:600}
.files{display:flex;flex-direction:column;gap:4px;margin-top:8px}
.files div{display:flex;gap:10px;flex-wrap:wrap;font-size:13.5px;padding:4px 0;border-bottom:1px dashed var(--line)}
.chk{width:16px;height:16px;accent-color:var(--accent)}
@media (max-width:800px){
  .app{grid-template-columns:1fr}
  aside{border-inline-end:none;border-bottom:1px solid var(--line)}
  .clist{max-height:200px}
  main{padding:16px}
}
</style>
</head>
<body>
<div class="app">
  <aside>
    <div class="brand">הצהרת הון<small>ריכוז אישורים ונתונים לפי טופס 1219</small></div>
    <button class="btn pri" data-act="newc" type="button">+ תיק הצהרה חדש</button>
    <input id="q" class="search" type="search" placeholder="חיפוש לקוח" aria-label="חיפוש לקוח">
    <div class="clist" id="clist"></div>
    <div id="syncbox" class="syncbox"></div>
    <button type="button" class="citem" id="learnbtn" data-act="rules"><b>מה הכלי למד</b><span>כללים ותיקונים: <i id="learncount" style="font-style:normal">0</i></span></button>
    <div class="savestate" id="savestate">טוען…</div>
  </aside>
  <main id="main"></main>
</div>
<datalist id="curs"><option value="ILS"><option value="USD"><option value="EUR"><option value="GBP"><option value="CHF"><option value="CAD"><option value="AUD"><option value="JPY"></datalist>
<input type="file" id="fileinput" multiple accept=".pdf,image/png,image/jpeg,image/webp,.xlsx,.xls,.csv" hidden>
<div class="toast" id="toast" role="status"></div>
<script>
'use strict';
/* ---------- מבנה הטופס ---------- */
const FIELD={
  asset_type:{l:'סוג הנכס'}, date:{l:'תאריך רכישה'}, gush:{l:'גוש'}, helka:{l:'חלקה'}, tat_helka:{l:'תת חלקה'},
  address:{l:'כתובת',w:'wide'}, country:{l:'מדינה'}, currency:{l:'מטבע',t:'cur'},
  amount_fx:{l:'סכום במט"ח',t:'num'}, amount_ils:{l:'סכום ₪',t:'num'},
  institution:{l:'שם המוסד',w:'wide'}, holder:{l:'שם בעל החשבון',w:'wide'}, account_no:{l:'מספר חשבון'},
  bank_no:{l:'מספר הבנק'}, branch_no:{l:'מספר הסניף'}, quantity:{l:'כמות',t:'num'}, wallet:{l:'כתובת ארנק',w:'wide'},
  account_type:{l:'סוג החשבון'}, security_type:{l:'סוג נייר ערך'}, party:{l:'שם'}, relation:{l:'הקירבה'},
  id_no:{l:'מספר זהות / ח"פ'}, year:{l:'שנת היווצרות החוב'}, vehicle_type:{l:'סוג'}, plate:{l:'מספר רישוי / רישום'},
  item_type:{l:'סוג הפריט'}, market_fx:{l:'שווי שוק במט"ח',t:'num'}, market_ils:{l:'שווי שוק ₪',t:'num'}, balance_ils:{l:'יתרה צבורה ₪ (לעיון)',t:'num'}
};
const BANKCOLS=['country','institution','holder','account_no','bank_no','branch_no','currency','amount_fx','amount_ils'];
const SECTIONS=[
  {n:1,code:10,t:'נדל"ן בארץ',cols:['asset_type','date','gush','helka','tat_helka','address','amount_ils'],lb:{date:'תאריך רכישה / שיפורים',amount_ils:'עלות ₪'},hint:'לפי עלות, כולל עלויות נלוות'},
  {n:2,code:20,t:'נדל"ן בחו"ל',cols:['asset_type','date','country','address','currency','amount_fx','amount_ils'],lb:{date:'תאריך רכישה / שיפורים',amount_fx:'עלות במט"ח',amount_ils:'עלות ₪'}},
  {n:3,code:30,t:'חשבונות בבנקים ובמוסדות כספיים בארץ ובחו"ל',cols:BANKCOLS},
  {n:4,code:40,t:'נכסים דיגיטליים',cols:['asset_type','quantity','date','wallet','amount_ils'],lb:{amount_ils:'עלות ₪'}},
  {n:5,code:50,t:'מזומנים (שלא בבנק)',cols:['currency','amount_fx','amount_ils']},
  {n:6,code:60,t:'ביטוח חיים, קופות גמל, פנסיה, השתלמות ותכניות חיסכון',cols:['account_type','country','institution','holder','currency','amount_fx','amount_ils'],lb:{amount_fx:'סכום במט"ח',amount_ils:'סה"כ לפי האישור למס ₪'},hint:'הסה"כ הסופי בטבלת האישור למס'},
  {n:7,code:70,t:'ניירות ערך וקרנות נאמנות בארץ ובחו"ל',cols:['security_type','country','institution','holder','account_no','bank_no','branch_no','currency','amount_fx','amount_ils'],lb:{amount_fx:'עלות במט"ח',amount_ils:'עלות ₪'},market:true},
  {n:8,code:80,t:'חייבים – הלוואות שנתתי לאחרים',cols:['party','relation','id_no','year','currency','amount_fx','amount_ils'],lb:{party:'שם החייב'}},
  {n:9,code:90,t:'כלי תחבורה, לרבות רכב, שייט וטייס',cols:['vehicle_type','date','plate','amount_ils'],lb:{amount_ils:'עלות ₪'}},
  {n:10,code:100,t:'תכשיטים, זהב, יהלומים, אספנות ואומנות',cols:['item_type','date','amount_ils'],lb:{amount_ils:'עלות ₪'}},
  {n:11,code:110,t:'תכולת בית',cols:['item_type','date','amount_ils'],lb:{amount_ils:'עלות ₪'}},
  {n:12,code:120,t:'רכוש אחר שלא פורט',cols:['item_type','date','amount_ils'],lb:{amount_ils:'עלות ₪'}},
  {n:13,code:130,t:'התחייבויות לבנקים ולמוסדות כספיים',cols:BANKCOLS,liab:true},
  {n:14,code:140,t:'הלוואות שלקחתי מאחרים',cols:['party','relation','id_no','year','currency','amount_fx','amount_ils'],lb:{party:'שם המלווה'},liab:true}
];
const SEC={}; SECTIONS.forEach(s=>SEC[s.n]=s);
const lab=(s,k)=>(s.lb&&s.lb[k])||FIELD[k].l;
const colsOf=s=>s.market?[...s.cols,'market_fx','market_ils']:s.extra?[...s.cols,...s.extra]:s.cols;

/* ---------- מצב ---------- */
let db=null,sample=null,col=null,maxImg=0,imgTypes=['image/jpeg','image/png','image/webp'],storeMode='init';
let learn={rules:[],lessons:[]}, view='client';
let roster=null, mcp=null, syncPending=null, syncTimer=null, syncMsg='', syncCls='', pickQ='';
const SYNC_TASK='trig_01485Q1C7daVaBh7yNsnCMgt';
const LEARN_ID='_learn';
const clients=new Map(); let curId=null, tab='docs', q='', showDetails=false, jobs=[], undo=null, armed=null, loaded=false;
const dirty=new Set(), writing=new Set(), timers=new Map(); let chain=Promise.resolve();
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uidGen=p=>p+Date.now().toString(36)+Math.random().toString(36).slice(2,7);
const num=v=>{if(v==null)return null;const s=String(v).replace(/[,\s₪$€]/g,'');if(s===''||s==='-')return null;const n=Number(s);return isFinite(n)?n:null;};
const fmt=v=>v==null?'—':Math.round(v).toLocaleString('he-IL');
const dmy=iso=>{if(!iso)return '';const m=/^(\d{4})-(\d{2})-(\d{2})/.exec(iso);return m?`${m[3]}/${m[2]}/${m[1]}`:iso;};
const cur=()=>clients.get(curId);

/* ---------- חישוב ---------- */
function rateOf(c,code){code=(code||'ILS').toUpperCase(); if(code==='ILS'||code==='NIS')return 1; const r=num(c.rates&&c.rates[code]); return r&&r>0?r:null;}
function conv(c,it,fxK,ilsK,autoK){
  const code=(it.f.currency||'ILS').toUpperCase(); const fx=num(it.f[fxK]), ils=num(it.f[ilsK]);
  if(code!=='ILS'&&code!=='NIS'&&it[autoK]!==false&&fx!=null){const r=rateOf(c,code); if(r)return{v:fx*r,auto:true}; return{v:ils,missing:code};}
  if(ils!=null)return{v:ils};
  if((code==='ILS'||code==='NIS')&&fx!=null)return{v:fx};
  return{v:null};
}
function valueOf(c,it){
  const s=SEC[it.s];
  if(s&&s.market&&c.basis==='market'&&(num(it.f.market_ils)!=null||num(it.f.market_fx)!=null))return conv(c,it,'market_fx','market_ils','mauto');
  return conv(c,it,'amount_fx','amount_ils','auto');
}
function totals(c){
  const by={}; SECTIONS.forEach(s=>by[s.n]=0); let missing=new Set();
  for(const it of c.items){ if(it.inc===false)continue; const r=valueOf(c,it); if(r.missing)missing.add(r.missing); if(r.v!=null&&by[it.s]!=null)by[it.s]+=Math.round(r.v); }
  let a=0,l=0; SECTIONS.forEach(s=>{ if(s.liab)l+=by[s.n]; else a+=by[s.n]; });
  return{by,a,l,net:a-l,missing};
}
function currenciesOf(c){const set=new Set(['USD','EUR']); for(const it of [...c.items,...c.pending]){const k=(it.f.currency||'').toUpperCase(); if(k&&k!=='ILS'&&k!=='NIS')set.add(k);} return [...set];}

/* ---------- שמירה ---------- */
function setSave(t){$('#savestate').textContent=t;}
function touch(c){c=c||cur(); if(!c)return; c.updatedAt=Date.now(); saveSoon(c.id);}
function saveSoon(id){dirty.add(id); clearTimeout(timers.get(id)); setSave('שומר…'); timers.set(id,setTimeout(()=>flush(id),700));}
function flush(id){
  timers.delete(id);
  chain=chain.then(async()=>{
    const c=id===LEARN_ID?learn:clients.get(id); dirty.delete(id); if(!c)return;
    writing.add(id);
    try{
      if(col) await col.doc(id).set(JSON.parse(JSON.stringify(c)));
      else saveLocal();
      setSave(storeMode==='db'?'כל השינויים נשמרו':storeMode==='local'?'נשמר בדפדפן הזה בלבד':'לא נשמר – אין שמירה בתצוגה הזו');
    }catch(e){

function canvasBlob(cv){return new Promise(r=>cv.toBlob(b=>r(b),'image/jpeg',0.85));}
async function prepare(file){
  const name=file.name.toLowerCase();
  if(file.type==='application/pdf'||name.endsWith('.pdf')){
    if(!window.pdfjsLib)throw{msg:'רכיב קריאת ה-PDF לא נטען. רענן את הדף'};
    pdfjsLib.GlobalWorkerOptions.workerSrc='https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';
    const pdf=await pdfjsLib.getDocument({data:new Uint8Array(await file.arrayBuffer()),isEvalSupported:false}).promise;
    const n=pdf.numPages; let text=''; const images=[];
    for(let p=1;p<=Math.min(n,60);p++){
      const page=await pdf.getPage(p);
      try{const tc=await page.getTextContent(); text+=`\n--- עמוד ${p} ---\n`+tc.items.map(i=>i.str).join(' ');}catch(_){}
      if(p<=maxImg){const vp1=page.getViewport({scale:1}); const sc=Math.min(2.2,1600/vp1.width); const vp=page.getViewport({scale:sc}); const cv=document.createElement('canvas'); cv.width=Math.floor(vp.width); cv.height=Math.floor(vp.height); const ctx=cv.getContext('2d'); ctx.fillStyle='#fff'; ctx.fillRect(0,0,cv.width,cv.height); await page.render({canvasContext:ctx,viewport:vp}).promise; const b=await canvasBlob(cv); if(b)images.push(b);}
    }
    if(!images.length&&text.replace(/---.*?---|\s/g,'').length<40)throw{msg:'לא ניתן לקרוא את הקובץ (סרוק וללא אפשרות לשלוח תמונה)'};
    return{images,text:text.slice(0,60000),pages:n};
  }
  if(file.type.startsWith('image/')){
    if(!maxImg)throw{msg:'שליחת תמונות אינה זמינה בתצוגה הזו'};
    if(imgTypes.includes(file.type))return{images:[file],text:'',pages:1};
    const bmp=await createImageBitmap(file); const cv=document.createElement('canvas'); cv.width=bmp.width; cv.height=bmp.height; cv.getContext('2d').drawImage(bmp,0,0); return{images:[await canvasBlob(cv)],text:'',pages:1};
  }
  if(/\.(xlsx|xls|csv)$/.test(name)){
    if(!window.XLSX)throw{msg:'רכיב קריאת האקסל לא נטען. רענן את הדף'};
    const wb=XLSX.read(await file.arrayBuffer(),{type:'array'}); let text='';
    wb.SheetNames.forEach(sn=>{text+=`\n--- גיליון ${sn} ---\n`+XLSX.utils.sheet_to_csv(wb.Sheets[sn]);});
    return{images:[],text:text.slice(0,80000),pages:wb.SheetNames.length};
  }
  throw{msg:'סוג קובץ לא נתמך. אפשר PDF, תמונה או אקסל'};
}

Form sections (number: title — allowed field keys):
${secs}

Rules:

- Section 6 amount rule: for pension, provident (גמל) and study fund (השתלמות) documents, the ONLY relevant part is the tax-certificate table (the "אישור למס הכנסה" / "אישור שנתי לצורכי מס" section) and specifically its final total line (סה"כ). amount_ils = that final total, as printed. Ignore everything else in the document: balances, returns, management fees, insurance coverage, projections. If the document has no such tax-certificate table, leave amount_ils empty, set confidence "low" and say in note that the tax-certificate table was not found. Typical layout ("אישור מס להצהרת הון" / "אישור מס עבור קרן פנסיה"): a table with columns עובד / מעסיק / סה"כ and rows such as "הפקדה לקצבה מזכה", "הפקדה לקצבה מוכרת", and a last row "סה"כ:". Take the single number where the "סה"כ:" row meets the "סה"כ" column (the bottom-left corner number in a right-to-left table), e.g. 41,298.00 → amount_ils "41298". Do NOT add the employee and employer columns yourself, and do NOT add amounts from any other table: transfer tables (ניוד, נכנס/יוצא, ניוד מחברה אחרת) are ignored completely, even when they list money moved into this fund. The as_of_date is the date stated in the certificate sentence (e.g. "עד ליום 31.12.2025" → 2025-12-31). One item per fund/account in the certificate.

- Vehicles go to section 9 with the purchase cost if shown (leave amount empty if only a license is shown, and say so in note). Real estate goes to 1 or 2 with cost incl. related costs; gush/helka/tat_helka from the contract or land registry.

        const s=SEC[parseInt(x&&x.section,10)]; if(!s)continue;
        const f={}; const src=(x.fields&&typeof x.fields==='object')?x.fields:{};
        colsOf(s).forEach(k=>{if(src[k]!=null&&String(src[k]).trim()!=='')f[k]=String(src[k]).trim();});
        if(f.currency)f.currency=f.currency.toUpperCase();
        if(s.cols.includes('currency')&&!f.currency)f.currency='ILS';
        const it={id:uidGen('i'),s:s.n,f,inc:true,src:j.f.name,note:String(x.note||''),asof:/^\d{4}-\d{2}-\d{2}$/.test(x.as_of_date||'')?x.as_of_date:((res.document&&/^\d{4}-\d{2}-\d{2}$/.test(res.document.as_of_date||''))?res.document.as_of_date:''),conf:x.confidence||''};
        if(s.n===6)it.dep6=true;
        it.auto=!(f.amount_ils&&f.currency&&f.currency!=='ILS'); it.mauto=!(f.market_ils&&f.currency&&f.currency!=='ILS');
        const dd=res.document||{}; it.inst=String(dd.institution||''); it.kind=String(dd.kind||'');
        it.orig={s:it.s,f:Object.assign({},f)};
        c.pending.push(it); n++;
      }
      const d=res&&res.document||{};
      c.files.push({name:j.f.name,at:Date.now(),n,kind:String(d.kind||''),inst:String(d.institution||''),asof:/^\d{4}-\d{2}-\d{2}$/.test(d.as_of_date||'')?d.as_of_date:'',summary:String(d.summary||'')});
      j.busy=false; j.status=n?`נמצאו ${n} פריטים לאישור`:(d.summary?String(d.summary):'לא נמצאו נתונים רלוונטיים');
      touch(c); if(curId===c.id&&tab==='docs')render(); else renderSidebar();
    }catch(e){
      j.busy=false; j.err=true; j.status=errText(e); renderJobs();
      if(e&&(e.code==='not_granted'||e.code==='sampling_disabled')){js.forEach(o=>{if(o.busy){o.busy=false;o.err=true;o.status='בוטל';}}); renderJobs(); break;}
    }
    delete j.f;
  }
}

/* ---------- פעולות ---------- */

  const c=normalize(Object.assign({id:uidGen('c'),name:'לקוח חדש',tz:'',spouse:'',date:`${new Date().getFullYear()-1}-12-31`,basis:'cost',rates:{},items:[],pending:[],files:[],createdAt:Date.now(),updatedAt:Date.now()},data||{}));
  clients.set(c.id,c); curId=c.id; saveSoon(c.id); return c;
}

document.addEventListener('click',e=>{
  const b=e.target.closest('[data-act]'); if(!b)return; const a=b.dataset.act, c=cur();
  if(a!=='delclient'&&armed){armed=null;}
  switch(a){
    case 'newc': view='pick'; pickQ=''; pickHi=0; pickOpen=true; render(); break;
    case 'newblank': view='client'; newClient(); showDetails=true; tab='docs'; render(); setTimeout(()=>{const n=$('#c-name'); if(n){n.focus();n.select();}},0); break;
    case 'pickc': { const r=((roster&&roster.clients)||[]).find(x=>x.tz===b.dataset.tz&&x.name===b.dataset.name)||{}; view='client'; newClient({name:r.name||b.dataset.name,tz:r.tz||'',spouse:spName(r),spouseTz:r.spouseTz||'',refTz:r.tz||''}); showDetails=true; tab='docs'; render(); break; }
    case 'sync': doSync(); break;
    case 'demo': demo(); break;
    case 'pick': if(curId===b.dataset.id&&view==='client'){showDetails=!showDetails;} else {curId=b.dataset.id; showDetails=false; view='client';} render(); break;
    case 'tab': tab=b.dataset.tab; render(); break;
    case 'details': showDetails=!showDetails; render(); break;
    case 'delclient': if(armed===c.id){armed=null; removeClient(c.id); toast('התיק נמחק');} else {armed=c.id; render();} break;
    case 'browse': $('#fileinput').click(); break;
    case 'approve': { const i=c.pending.findIndex(x=>x.id===b.dataset.id); if(i>-1){const it=c.pending.splice(i,1)[0]; const learned=recordLesson(it); delete it.orig; c.items.push(it); touch(c); if(learned)touchLearn(); render(); if(learned)toast('אושר. התיקון נשמר ללמידה');} break; }
    case 'approveAll': { let k=0; c.pending.forEach(it=>{if(recordLesson(it))k++; delete it.orig;}); c.items.push(...c.pending); const n=c.pending.length; c.pending=[]; touch(c); if(k)touchLearn(); render(); toast(`${n} פריטים אושרו${k?`, ${k} תיקונים נשמרו ללמידה`:''}`); break; }
    case 'ok6': { const it=c.items.find(x=>x.id===b.dataset.id); if(it){it.dep6=true; touch(c); render();} break; }
    case 'rules': view='rules'; render(); break;
    case 'back': view='client'; render(); break;
    case 'addrule': { const el=$('#newrule'); const v=el.value.trim(); if(!v){el.focus();break;} learn.rules.push({id:uidGen('r'),text:v,at:Date.now()}); touchLearn(); render(); setTimeout(()=>{const n=$('#newrule'); if(n)n.focus();},0); break; }
    case 'delrule': { const i=learn.rules.findIndex(r=>r.id===b.dataset.id); if(i<0)break; const [r]=learn.rules.splice(i,1); touchLearn(); render(); toast('הכלל נמחק',()=>{learn.rules.splice(i,0,r); touchLearn(); render();}); break; }
    case 'dellesson': { const i=learn.lessons.findIndex(r=>r.id===b.dataset.id); if(i<0)break; const [r]=learn.lessons.splice(i,1); touchLearn(); render(); toast('התיקון נמחק',()=>{learn.lessons.splice(i,0,r); touchLearn(); render();}); break; }
    case 'delp': case 'del': {
      const arr=a==='delp'?c.pending:c.items, i=arr.findIndex(x=>x.id===b.dataset.id); if(i<0)break;
      const [it]=arr.splice(i,1); touch(c); render();
      toast('השורה נמחקה',()=>{arr.splice(i,0,it); touch(c); render();}); break; }
    case 'add': { const s=SEC[+b.dataset.s]; const f={}; if(s.cols.includes('currency'))f.currency='ILS'; if(s.cols.includes('country'))f.country='ישראל';
      const it={id:uidGen('i'),s:s.n,f,inc:true,src:'ידני',note:'',asof:'',conf:'',auto:true,mauto:true}; c.items.push(it); touch(c); render();
      setTimeout(()=>{const el=document.getElementById(`f-${it.id}-${s.cols[0]}`); if(el)el.focus();},0); break; }
    case 'copy': copyText(b.dataset.copy); break;
    case 'copyrow': copyText(b.dataset.copy,'השורה הועתקה'); break;
    case 'copyall': copyText(allTsv(c),'הסיכום המלא הועתק. אפשר להדביק באקסל'); break;
  }
});
function maskDate(t,e){
  const del=e.inputType&&e.inputType.startsWith('delete');
  const d=t.value.replace(/\D/g,'').slice(0,8);
  let out=d.slice(0,2); if(d.length>2)out+='/'+d.slice(2,4); if(d.length>4)out+='/'+d.slice(4);
  if(!del&&(d.length===2||d.length===4))out+='/';
  if(t.value!==out)t.value=out;
}
document.addEventListener('input',e=>{
  const t=e.target, c=cur();
  if(t.dataset&&(t.dataset.cdate||t.dataset.k==='date'))maskDate(t,e);
  if(t.id==='q'){q=t.value.trim(); renderSidebar(); return;}
  if(t.id==='pickq'){pickQ=t.value; pickHi=0; pickOpen=true; refreshPick(); return;}
  if(t.dataset.lnote){const l=learn.lessons.find(x=>x.id===t.dataset.lnote); if(l){l.note=t.value; touchLearn();} return;}
  if(!c)return;
  if(t.dataset.k){
    const it=findItem(t.dataset.list,t.dataset.id); if(!it)return; const k=t.dataset.k; let v=t.value; if(k==='currency')v=v.toUpperCase();
    it.f[k]=v; if(k==='amount_ils')it.auto=v.trim()===''; if(k==='market_ils')it.mauto=v.trim()==='';
    touch(c); refreshLive();
  } else if(t.dataset.c){
    c[t.dataset.c]=t.value; touch(c);
    if(t.dataset.c==='name'){const h=document.querySelector('.namebtn'); if(h)h.firstChild.textContent=t.value||'ללא שם'; renderSidebar();}
    if(t.dataset.c==='basis')render();
    if(t.dataset.c==='date'){const b=document.querySelector('.head .sub b'); if(b)b.textContent=dmy(t.value)||'—'; renderSidebar();}
  } else if(t.dataset.cdate){
    const v=t.value.trim(); let m=/^(\d{1,2})[\/.\-](\d{1,2})[\/.\-](\d{4})$/.exec(v)||/^(\d{2})(\d{2})(\d{4})$/.exec(v);
    let iso=null; if(m){const d=+m[1],mo=+m[2],y=+m[3]; const dt=new Date(Date.UTC(y,mo-1,d)); if(y>=1950&&y<=2100&&dt.getUTCMonth()===mo-1&&dt.getUTCDate()===d)iso=`${y}-${String(mo).padStart(2,'0')}-${String(d).padStart(2,'0')}`;}
    t.classList.toggle('bad',!!v&&!iso);
    if(iso&&iso!==c.date){c.date=iso; touch(c); const b=document.querySelector('.head .sub b'); if(b)b.textContent=dmy(iso); renderSidebar();}
  } else if(t.dataset.rate){ c.rates[t.dataset.rate]=t.value; touch(c); refreshLive(); }
});
document.addEventListener('change',e=>{
  const t=e.target, c=cur(); if(!c)return;
  if(t.id==='fileinput'){processFiles(t.files); t.value=''; return;}
  if(t.dataset.act==='psec'){const it=findItem('pending',t.dataset.id); if(it){it.s=+t.value; const s=SEC[it.s]; if(s.cols.includes('currency')&&!it.f.currency)it.f.currency='ILS'; touch(c); render();}}
  if(t.dataset.act==='inc'){const it=findItem('items',t.dataset.id); if(it){it.inc=t.checked; touch(c); refreshLive();}}
  if(t.dataset.k==='currency'){ if(showDetails)render(); else refreshLive(); }
});
document.addEventListener('focusin',e=>{if(e.target.id==='pickq'){pickOpen=true;refreshPick();}});
document.addEventListener('mousedown',e=>{const o=e.target.closest&&e.target.closest('.ddi'); if(o)e.preventDefault();});
document.addEventListener('focusout',e=>{if(e.target.id==='pickq'){pickOpen=false;setTimeout(refreshPick,0);}});
document.addEventListener('keydown',e=>{
  if(e.target.id!=='pickq')return; const f=pickMatches(), n=Math.min(f.length,50);
  if(e.key==='ArrowDown'){e.preventDefault();pickOpen=true;pickHi=Math.min(pickHi+1,n-1);refreshPick();}
  else if(e.key==='ArrowUp'){e.preventDefault();pickHi=Math.max(pickHi-1,0);refreshPick();}
  else if(e.key==='Escape'){pickOpen=false;refreshPick();}
  else if(e.key==='Enter'){e.preventDefault();const o=document.querySelector('.ddi.hi'); if(o)o.click();}
});
document.addEventListener('dragover',e=>{const d=e.target.closest&&e.target.closest('#drop'); if(d){e.preventDefault(); d.classList.add('over');}});
document.addEventListener('dragleave',e=>{const d=e.target.closest&&e.target.closest('#drop'); if(d)d.classList.remove('over');});
document.addEventListener('drop',e=>{const d=e.target.closest&&e.target.closest('#drop'); if(d){e.preventDefault(); d.classList.remove('over'); processFiles(e.dataTransfer.files);} else e.preventDefault();});

/* ---------- אתחול ---------- */
render(); setSave('טוען…');
(async()=>{
  const use=n=>window.claude&&window.claude.use?window.claude.use(n).catch(()=>null):Promise.resolve(null);
  const [d,u,s]=await Promise.all([use('db'),use('user'),use('sample')]);
  use('mcp').then(m=>{mcp=m||null; renderSync();});
  sample=s||null;
  if(sample){try{const lim=await sample.limits(); if(lim&&lim.images){maxImg=Math.min(lim.images.maxCount||0,10); imgTypes=lim.images.mediaTypes||imgTypes;}}catch(_){}}
  let uid=null; if(u){try{uid=await u.id();}catch(_){}}
  if(d&&uid){
    db=d; col=db.collection('data/users/'+uid); storeMode='db';
    try{ db.doc('roster/list').onSnapshot(sn=>{roster=sn.exists?sn.data():null; onRoster();},()=>{}); }catch(_){}
    col.onSnapshot(snap=>{
      let changed=!loaded;
      snap.docChanges().forEach(ch=>{
        const id=ch.doc.id; if(dirty.has(id)||writing.has(id))return;
        if(id===LEARN_ID){ if(ch.type!=='removed'){const d=ch.doc.data(); if((d.updatedAt||0)>(learn.updatedAt||0)){learn=normLearn(JSON.parse(JSON.stringify(d))); changed=true;}} return; }
        if(ch.type==='removed'){if(clients.delete(id))changed=true; return;}
        const data=ch.doc.data(), local=clients.get(id);
        if(local&&(local.updatedAt||0)>=(data.updatedAt||0))return;
        clients.set(id,normalize(JSON.parse(JSON.stringify(data)))); changed=true;
      });
      if(!loaded){loaded=true; setSave(clients.size?'כל השינויים נשמרו':'השמירה פעילה');}
      if(changed){pickDefault(); const ae=document.activeElement; if(ae&&ae.closest&&ae.closest('#main')&&ae.matches('input'))renderSidebar(); else render();}
    },err=>{setSave('החיבור לשמירה נותק. רענן את הדף');});
  } else {
    loadLocal(); pickDefault(); render();
    setSave(storeMode==='local'?'השמירה הקבועה אינה זמינה. הנתונים נשמרים בדפדפן הזה בלבד':'השמירה אינה זמינה. הנתונים יימחקו ברענון');
  }
  if(!sample&&cur()&&tab==='docs')render();
})();
